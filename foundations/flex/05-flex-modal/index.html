<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Modal</title>
</head>

<body>
  <section class="modal">
    
    <!-- Exclamation mark warning image -->
    <div class="icon">!</div>

    <!-- everything else goes inside here -->
    <div>
      <section class="container">
        <h4>Are you sure you want to do that?</h4>
        <div class="close-button">X</div>
      </section>
      <section class="text">
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quisquam voluptate, nulla, dolorum
          similique rem repellat quis modi unde vero tenetur assumenda dignissimos delectus deleniti ab autem.
          Iste assumenda consectetur maxime.</p>
        <button class="continue">Continue</button>
        <button class="cancel">Cancel</button>
      </section>
    </div>

  </section>
</body>

</html>
